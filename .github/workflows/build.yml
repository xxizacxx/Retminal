# Fabrique Retminal pour Mac (.dmg) et Windows (.zip).
#  - a la main : onglet Actions -> "Build" -> Run workflow (fichiers dans "Artifacts")
#  - en poussant un tag  v6.9  : cree aussi une Release GitHub avec les 2 fichiers
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependances
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Tests
        run: python -m unittest -v

      - name: Test de fumee (vraie fenetre)
        run: python tests/smoke_gui.py

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --noconsole --name Retminal `
            --icon assets/Retminal.ico --add-data "assets;assets" main.py
          Compress-Archive -Path dist/Retminal -DestinationPath Retminal-windows.zip

      - name: Build Mac
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Retminal \
            --icon assets/Retminal.icns --add-data "assets:assets" main.py
          mkdir dmg-stage
          cp -R dist/Retminal.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname Retminal -srcfolder dmg-stage -ov -format UDZO Retminal-macos.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: Retminal-${{ runner.os }}
          path: Retminal-*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Retminal-*.* \
            --repo "$GITHUB_REPOSITORY" --title "Retminal $GITHUB_REF_NAME" --generate-notes
